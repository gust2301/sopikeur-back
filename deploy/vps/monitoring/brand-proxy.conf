# ==============================================================================
# Filtre de marque devant Beszel (Caddy -> brand:8080 -> beszel-hub:8090)
# ==============================================================================
# Modifie uniquement la page HTML : titre, nom iPhone, et charge brand.css /
# brand.js (servis par Caddy depuis proxy/branding/monitoring). Le reste
# (API, temps réel, fichiers) passe tel quel.
# À revérifier après une mise à jour de Beszel (balise <title> attendue).
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_tokens off;

    location / {
        proxy_pass http://beszel-hub:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Réponse non compressée pour pouvoir la modifier (Caddy recompresse)
        proxy_set_header Accept-Encoding "";
        # Temps réel Beszel (SSE / WebSocket)
        proxy_buffering off;
        proxy_read_timeout 1h;

        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '<title>Beszel</title>' '<title>Sopiker Monitoring</title><meta name="apple-mobile-web-app-title" content="Sopiker VPS" /><meta name="application-name" content="Sopiker Monitoring" /><link rel="stylesheet" href="/static/brand.css" /><script src="/static/brand.js"></script>';
    }
}
