# ==============================================================================
# /srv/sopiker/staging — MySQL 8.4 + backend Spring Boot (profil staging)
# ==============================================================================
# .env (Compose + MySQL) et app.env (backend, sans le mot de passe root).
# Totalement séparé de la production : réseaux, volume et .env distincts.
# Réseaux internes sans Internet (voir production/compose.yml).
# Mise en service réelle : ajouter dans .env
#   COMPOSE_FILE=compose.yml:compose.live.yml
# (ajoute le réseau "egress" ; deploy.sh et docker compose l'appliquent ensuite).
# ==============================================================================

name: sopiker-staging

services:
  mysql_staging:
    image: mysql:8.4
    container_name: sopiker-mysql-staging
    restart: unless-stopped
    # Petite base : réglages mémoire réduits (pic observé : 11 connexions)
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=64M", "--max-connections=30"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_INITDB_SKIP_TZINFO: 1
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - db
    mem_limit: 768m

  backend_staging:
    image: ghcr.io/gust2301/sopikeur-back:${APP_IMAGE_TAG}
    container_name: sopiker-backend-staging
    restart: unless-stopped
    # Variables applicatives uniquement (pas de MYSQL_ROOT_PASSWORD) : voir app.env.example
    env_file:
      - app.env
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql_staging:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql_staging:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - db
      - edge
    mem_limit: 768m

volumes:
  mysql_data:
    name: sopiker_staging_mysql

networks:
  db:
    name: sopiker_staging_db
    internal: true
  edge:
    name: sopiker_staging_edge
    internal: true
