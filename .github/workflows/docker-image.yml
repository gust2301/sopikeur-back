# ==============================================================================
# GitHub Actions Workflow - Build & Push Docker Image to GHCR
# ==============================================================================
# Déclenché sur: push sur main/master/develop et tags ; déploie develop -> staging, master -> production
# Build l'image Docker et la push vers GitHub Container Registry (GHCR)
# Tags créés: latest + SHA court (ex: abc1234)
# ==============================================================================

name: Docker Image CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Verify backend
        run: ./mvnw -B clean verify

  # ----------------------------------------------------------------------------
  # Build and Push Docker Image
  # ----------------------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    needs: verify

    # Permissions requises pour GHCR
    permissions:
      contents: read
      packages: write

    steps:
      # -------------------------------------------------------------------------
      # 1. Checkout du code source
      # -------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # -------------------------------------------------------------------------
      # 2. Setup Docker Buildx (pour cache et multi-platform)
      # -------------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------------------------------------------------------
      # 3. Login to GitHub Container Registry (GHCR)
      # -------------------------------------------------------------------------
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------------------
      # 4. Extract metadata (tags, labels) pour Docker
      # -------------------------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag 'latest' pour la branche principale
            type=raw,value=latest,enable={{is_default_branch}}
            # SHA court (7 caractères) pour chaque commit
            type=sha,format=short,prefix=
            # Tag de version si c'est un tag git (ex: v1.0.0 -> 1.0.0)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Nom de branche (pour develop, etc.)
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=Sopikeur Backend
            org.opencontainers.image.description=Spring Boot 3 + Java 21 Backend
            org.opencontainers.image.vendor=Sopikeur

      # -------------------------------------------------------------------------
      # 5. Build et Push de l'image Docker
      # -------------------------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache Docker layers pour accélérer les builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Plateformes cibles (optionnel, décommenter si besoin multi-arch)
          # platforms: linux/amd64,linux/arm64

      # -------------------------------------------------------------------------
      # 6. Afficher les tags créés (pour logs)
      # -------------------------------------------------------------------------
      - name: Display image tags
        run: |
          echo "🐳 Image pushed successfully!"
          echo "📦 Tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo ""
          echo "🚀 develop/master : déploiement automatique (job deploy)."
          echo "   À la main sur le VPS : sudo /srv/sopiker/deploy.sh <production|staging> ${GITHUB_SHA::7}"

  # ----------------------------------------------------------------------------
  # Déploiement automatique sur le VPS (develop -> staging, master -> production)
  # ----------------------------------------------------------------------------
  # La clé VPS_DEPLOY_KEY (secret du dépôt) n'ouvre que la commande
  # « <staging|production> <sha> » de l'utilisateur deploy (voir deploy/vps/deploy-user).
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    environment: ${{ github.ref == 'refs/heads/develop' && 'staging' || 'production' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    permissions: {}
    env:
      TARGET: ${{ github.ref == 'refs/heads/develop' && 'staging' || 'production' }}
      API_URL: ${{ github.ref == 'refs/heads/develop' && 'https://api-staging.sopikeur.sn' || 'https://api.sopikeur.sn' }}

    steps:
      - name: Déployer sur le VPS
        id: deploy
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning title=Déploiement ignoré::Secret VPS_DEPLOY_KEY absent, déployer à la main avec deploy.sh"
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "57.131.201.16 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM52PN7tEDr6i/cM08PT63qN/DhN7YvXjkXWL6WHcJsJ" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deploy@57.131.201.16 "$TARGET ${GITHUB_SHA::7}"
          rm -f ~/.ssh/deploy_key
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Vérifier l'API publique
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors -m 20 "$API_URL/actuator/health"
          echo
          echo "✅ ${GITHUB_SHA::7} déployé sur $TARGET"
