# ==============================================================================
# GitHub Actions Workflow - Build & Push Docker Image to GHCR
# ==============================================================================
# Déclenché sur: push sur main/master et tags
# Build l'image Docker et la push vers GitHub Container Registry (GHCR)
# Tags créés: latest + SHA court (ex: abc1234)
# ==============================================================================

name: Docker Image CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Verify backend
        run: ./mvnw -B clean verify

  # ----------------------------------------------------------------------------
  # Build and Push Docker Image
  # ----------------------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    needs: verify

    # Permissions requises pour GHCR
    permissions:
      contents: read
      packages: write

    steps:
      # -------------------------------------------------------------------------
      # 1. Checkout du code source
      # -------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # -------------------------------------------------------------------------
      # 2. Setup Docker Buildx (pour cache et multi-platform)
      # -------------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------------------------------------------------------
      # 3. Login to GitHub Container Registry (GHCR)
      # -------------------------------------------------------------------------
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------------------
      # 4. Extract metadata (tags, labels) pour Docker
      # -------------------------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag 'latest' pour la branche principale
            type=raw,value=latest,enable={{is_default_branch}}
            # SHA court (7 caractères) pour chaque commit
            type=sha,format=short,prefix=
            # Tag de version si c'est un tag git (ex: v1.0.0 -> 1.0.0)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Nom de branche (pour develop, etc.)
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=Sopikeur Backend
            org.opencontainers.image.description=Spring Boot 3 + Java 21 Backend
            org.opencontainers.image.vendor=Sopikeur

      # -------------------------------------------------------------------------
      # 5. Build et Push de l'image Docker
      # -------------------------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache Docker layers pour accélérer les builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Plateformes cibles (optionnel, décommenter si besoin multi-arch)
          # platforms: linux/amd64,linux/arm64

      # -------------------------------------------------------------------------
      # 6. Afficher les tags créés (pour logs)
      # -------------------------------------------------------------------------
      - name: Display image tags
        run: |
          echo "🐳 Image pushed successfully!"
          echo "📦 Tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo ""
          echo "📝 To deploy this image, update APP_IMAGE_TAG in .env.prod with:"
          echo "   - latest (for the latest build)"
          echo "   - ${GITHUB_SHA::7} (for this specific commit)"
