# ==============================================================================
# Surveillance du VPS Sopiker
# ==============================================================================
# Toutes les 15 minutes, « ssh deploy@VPS status » (sopiker-status) vérifie :
# conteneurs, API prod/staging via Caddy, sauvegarde de moins de 26 h, disque.
# Passe par SSH et non par HTTPS : le Bot Fight Mode de Cloudflare bloque les
# serveurs de GitHub. VPS injoignable ou problème = échec = e-mail GitHub.
# Attention : GitHub suspend les workflows planifiés d'un dépôt public après
# 60 jours sans commit ; un e-mail prévient, il suffit de le réactiver.
# ==============================================================================

name: Monitoring VPS

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/monitoring.yml'

permissions: {}

concurrency:
  group: monitoring
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: État du VPS
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error title=Surveillance inactive::Secret VPS_DEPLOY_KEY absent"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "57.131.201.16 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM52PN7tEDr6i/cM08PT63qN/DhN7YvXjkXWL6WHcJsJ" > ~/.ssh/known_hosts
          for _ in 1 2 3; do
            if ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
                 -o ConnectTimeout=20 deploy@57.131.201.16 status > status.txt 2>&1; then
              rc=0; break
            else
              rc=$?; sleep 20
            fi
          done
          rm -f ~/.ssh/deploy_key
          cat status.txt
          grep '^PROBLÈME' status.txt | while read -r line; do echo "::error title=VPS Sopiker::${line#PROBLÈME }"; done
          if [ "$rc" -ne 0 ] && ! grep -q '^PROBLÈME' status.txt; then
            echo "::error title=VPS injoignable::Connexion SSH impossible (code $rc)"
          fi
          exit "$rc"
