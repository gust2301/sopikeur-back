<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <style>
    body { font-family: Arial, sans-serif; color: #1f2937; font-size: 12px; margin: 24px; }
    .header { border-bottom: 2px solid #111827; padding-bottom: 12px; margin-bottom: 18px; }
    .card { border: 1px solid #d1d5db; padding: 12px; margin-bottom: 14px; }
    .row { margin-bottom: 6px; }
    .label { color: #6b7280; }
    .amount { font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header">
    <h1>SOPIKËR</h1>
    <div>Recu de paiement</div>
  </div>

  <div class="card">
    <div class="row"><span class="label">Numero de recu:</span> {{receiptNumber}}</div>
    <div class="row"><span class="label">Date:</span> {{paymentDate}}</div>
    <div class="row"><span class="label">Reference commande:</span> {{orderReference}}</div>
    <div class="row"><span class="label">Client:</span> {{customerName}}</div>
    <div class="row"><span class="label">Methode:</span> {{paymentMethod}}</div>
  </div>

  <div class="card">
    <div class="amount">{{paymentAmount}}</div>
    <div class="row"><span class="label">Cumul paye:</span> {{paidTotal}}</div>
    <div class="row"><span class="label">Restant du:</span> {{dueTotal}}</div>
    <div class="row"><span class="label">Note:</span> {{paymentNote}}</div>
  </div>

  <div class="label">Document genere le {{generatedAt}}.</div>
</body>
</html>
