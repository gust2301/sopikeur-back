spring:
  application:
    name: sopikeur-back
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/sopikeur?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: sopikeur
    password: sopikeur
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

app:
  jwt:
    secret: "change-this-dev-secret-change-this-dev-secret"
    expiration-minutes: 1440
  cors:
    allowed-origins:
      - "http://localhost:4200"
      - "https://*.pages.dev"

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
