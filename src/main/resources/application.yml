spring:
  application:
    name: sopikeur-back
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${APP_JWT_SECRET:}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: []
  antispam:
    contact:
      rate-limit:
        requests: ${APP_ANTISPAM_CONTACT_REQUESTS:5}
        window-seconds: ${APP_ANTISPAM_CONTACT_WINDOW_SECONDS:60}
  turnstile:
    secret: ${APP_TURNSTILE_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
