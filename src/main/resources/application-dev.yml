spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sopikeur?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: ${APP_JWT_SECRET:}
  cors:
    allowed-origins:
      - "http://localhost:4200"
      - "http://127.0.0.1:4200"
      - "http://localhost:4201"
  turnstile:
    secret: ${APP_TURNSTILE_SECRET:}

logging:
  level:
    root: INFO
    sn.sopikeur: DEBUG
