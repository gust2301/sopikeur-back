app:
  jwt:
    secret: test-test-test-test-test-test-test-test
    expiration-minutes: 60
  cors:
    allowed-origins:
      - "https://develop.sopikeur-backoffice.pages.dev"
      - "http://localhost:4200"
      - "http://localhost:4201"
  tracking:
    base-url: "http://localhost:4200"
  antispam:
    contact:
      rate-limit:
        requests: 100000
        window-seconds: 1
  turnstile:
    secret: test-secret

spring:
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    placeholders:
      ADMIN_SUPER_PASSWORD_HASH: $2a$10$Dow1D.8VIfYqZqXF/94aK.Onx9..dRrN1Vj9fHD0sVdVQS8S8/.EW

logging:
  level:
    root: WARN
    org.springframework: WARN
