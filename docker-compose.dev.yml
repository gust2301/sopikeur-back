services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:sopikeur}
      MYSQL_USER: ${MYSQL_USER:sopikeur}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:sopikeur}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - sopikeur-net

  backend:
    build:
      context: .
    image: sopikeur-back:dev
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/sopikeur?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:sopikeur}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:sopikeur}
      APP_JWT_SECRET: ${APP_JWT_SECRET:dev-only-secret}
      APP_JWT_EXPIRATION_MINUTES: ${APP_JWT_EXPIRATION_MINUTES:1440}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sopikeur-net

volumes:
  mysql_data:

networks:
  sopikeur-net:
    driver: bridge
